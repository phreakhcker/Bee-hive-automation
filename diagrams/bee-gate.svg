<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1000" font-family="Verdana, sans-serif">
  <title>Bee Gate — Physical Layout + Wiring</title>
  <desc>Top view of the 8-channel bee counter gate showing tunnels, paired ITR9606 slot sensors, and per-sensor wiring.</desc>

  <defs>
    <style>
      .wireLabel  { fill: #f4e6c8; font-size: 12px; }
      .compLabel  { fill: #f4e6c8; font-size: 14px; font-weight: bold; }
      .subLabel   { fill: #a08b6b; font-size: 11px; }
      .title      { fill: #f0b429; font-size: 22px; font-weight: bold; }
      .sect       { fill: #f0b429; font-size: 14px; font-weight: bold; }
      .dim        { fill: #a08b6b; font-size: 10px; font-family: monospace; }
    </style>
  </defs>

  <rect width="1400" height="1000" fill="#1a1512"/>
  <text x="30" y="40" class="title">🐝  Bee Gate — Top View + Wiring Schematic</text>
  <text x="30" y="60" class="subLabel">8 tunnels × 2 ITR9606 slotted opto sensors = 16 phototransistor inputs.  A-then-B ⇒ exit, B-then-A ⇒ entry.</text>

  <!-- ============ TOP VIEW OF GATE (upper half) ============ -->
  <text x="30" y="105" class="sect">Physical Layout (top view — outer edge is bottom of image)</text>

  <g transform="translate(80, 130)">
    <!-- Gate outer body -->
    <rect x="0" y="0" width="1240" height="280" rx="10" fill="#3a3025" stroke="#c8b493" stroke-width="2"/>
    <text x="620" y="24" class="compLabel" text-anchor="middle">3D-printed ASA / PETG entrance restrictor — slides over the hive entrance</text>
    <text x="620" y="42" class="subLabel"  text-anchor="middle">150 mm long · fits standard Langstroth entrance reducer opening</text>

    <!-- 8 tunnels -->
    <g id="tunnels">
      <!-- Each tunnel is 8mm wide, drawn ~130px wide.  Spaced across the gate width. -->
      <g id="tunnel-template">
        <!-- Placeholder — actual tunnels drawn individually below. -->
      </g>

      <!-- Tunnel walls -->
      <line x1="60"   y1="70" x2="60"   y2="260" stroke="#c8b493" stroke-width="2"/>
      <line x1="200"  y1="70" x2="200"  y2="260" stroke="#c8b493" stroke-width="2"/>
      <line x1="340"  y1="70" x2="340"  y2="260" stroke="#c8b493" stroke-width="2"/>
      <line x1="480"  y1="70" x2="480"  y2="260" stroke="#c8b493" stroke-width="2"/>
      <line x1="620"  y1="70" x2="620"  y2="260" stroke="#c8b493" stroke-width="2"/>
      <line x1="760"  y1="70" x2="760"  y2="260" stroke="#c8b493" stroke-width="2"/>
      <line x1="900"  y1="70" x2="900"  y2="260" stroke="#c8b493" stroke-width="2"/>
      <line x1="1040" y1="70" x2="1040" y2="260" stroke="#c8b493" stroke-width="2"/>
      <line x1="1180" y1="70" x2="1180" y2="260" stroke="#c8b493" stroke-width="2"/>

      <!-- Beam A row (outer side of tunnel — hive-facing) -->
      <g fill="#f2933d">
        <circle cx="130"  cy="105" r="5"/>
        <circle cx="270"  cy="105" r="5"/>
        <circle cx="410"  cy="105" r="5"/>
        <circle cx="550"  cy="105" r="5"/>
        <circle cx="690"  cy="105" r="5"/>
        <circle cx="830"  cy="105" r="5"/>
        <circle cx="970"  cy="105" r="5"/>
        <circle cx="1110" cy="105" r="5"/>
      </g>
      <text x="0" y="109" class="wireLabel">Beam A →</text>
      <text x="1215" y="109" class="wireLabel" text-anchor="start">hive</text>

      <!-- Beam B row (inner side — outside-world facing) -->
      <g fill="#7aa87a">
        <circle cx="130"  cy="220" r="5"/>
        <circle cx="270"  cy="220" r="5"/>
        <circle cx="410"  cy="220" r="5"/>
        <circle cx="550"  cy="220" r="5"/>
        <circle cx="690"  cy="220" r="5"/>
        <circle cx="830"  cy="220" r="5"/>
        <circle cx="970"  cy="220" r="5"/>
        <circle cx="1110" cy="220" r="5"/>
      </g>
      <text x="0" y="224" class="wireLabel">Beam B →</text>
      <text x="1215" y="224" class="wireLabel" text-anchor="start">outside</text>

      <!-- Tunnel numbers -->
      <g class="dim" text-anchor="middle">
        <text x="130"  y="70" >T1</text>
        <text x="270"  y="70" >T2</text>
        <text x="410"  y="70" >T3</text>
        <text x="550"  y="70" >T4</text>
        <text x="690"  y="70" >T5</text>
        <text x="830"  y="70" >T6</text>
        <text x="970"  y="70" >T7</text>
        <text x="1110" y="70" >T8</text>
      </g>

      <!-- Sample bee path (dashed arrow showing exit direction on T4) -->
      <path d="M550,105 L550,220" stroke="#e05b5b" stroke-width="1.5" stroke-dasharray="3,2" marker-end="url(#tinyArrow)"/>
      <text x="565" y="170" class="wireLabel" fill="#e05b5b">bee exiting</text>
    </g>

    <!-- Dimensions -->
    <g class="dim">
      <line x1="60" y1="270" x2="200" y2="270" stroke="#a08b6b" marker-end="url(#tinyArrow)" marker-start="url(#tinyArrow)"/>
      <text x="130" y="266" text-anchor="middle">8 mm tunnel + 8 mm wall</text>

      <line x1="1080" y1="105" x2="1080" y2="220" stroke="#a08b6b" marker-end="url(#tinyArrow)" marker-start="url(#tinyArrow)"/>
      <text x="1088" y="165" >6–8 mm</text>

      <text x="620" y="257" text-anchor="middle" font-size="10" fill="#c8b493">30 mm tunnel depth · 8 × 8 mm cross-section (single-file bees)</text>
    </g>
  </g>

  <defs>
    <marker id="tinyArrow" markerWidth="6" markerHeight="5" refX="5" refY="2.5" orient="auto">
      <polygon points="0 0, 6 2.5, 0 5" fill="#a08b6b"/>
    </marker>
  </defs>

  <!-- ============ SINGLE-TUNNEL DETAIL (side view) ============ -->
  <text x="30" y="450" class="sect">Single Tunnel — Side View + Sensor Detail</text>

  <g transform="translate(80, 480)">
    <!-- Tunnel walls (side view) -->
    <rect x="0" y="20" width="600" height="120" fill="none" stroke="#c8b493" stroke-width="2"/>
    <text x="300" y="12" class="subLabel" text-anchor="middle">Tunnel viewed from the side</text>

    <!-- ITR9606 A (outer) -->
    <g transform="translate(140, 60)">
      <rect x="-25" y="-30" width="50" height="60" rx="3" fill="#1a1a1a" stroke="#f0b429"/>
      <text x="0" y="-40" class="subLabel" text-anchor="middle">ITR9606 · A</text>
      <!-- Slot -->
      <rect x="-20" y="20" width="40" height="20" fill="#3a3025"/>
      <!-- IR LED (yellow triangle) -->
      <polygon points="-18,25 -8,25 -13,35" fill="#f2933d"/>
      <!-- Phototransistor (green triangle) -->
      <polygon points="18,25 8,25 13,35" fill="#7aa87a"/>
      <!-- Beam representation -->
      <line x1="-8" y1="30" x2="8" y2="30" stroke="#f2933d" stroke-width="1" stroke-dasharray="2,2"/>
    </g>

    <!-- ITR9606 B (inner) -->
    <g transform="translate(460, 60)">
      <rect x="-25" y="-30" width="50" height="60" rx="3" fill="#1a1a1a" stroke="#f0b429"/>
      <text x="0" y="-40" class="subLabel" text-anchor="middle">ITR9606 · B</text>
      <rect x="-20" y="20" width="40" height="20" fill="#3a3025"/>
      <polygon points="-18,25 -8,25 -13,35" fill="#f2933d"/>
      <polygon points="18,25 8,25 13,35" fill="#7aa87a"/>
      <line x1="-8" y1="30" x2="8" y2="30" stroke="#f2933d" stroke-width="1" stroke-dasharray="2,2"/>
    </g>

    <!-- Bee walking through -->
    <g transform="translate(300, 90)">
      <ellipse cx="0" cy="0" rx="16" ry="8" fill="#f0b429" stroke="#1a1512"/>
      <line x1="-16" y1="0" x2="-22" y2="-2" stroke="#1a1512" stroke-width="0.8"/>
      <line x1="-16" y1="2" x2="-22" y2="4"  stroke="#1a1512" stroke-width="0.8"/>
      <text x="0" y="30" class="wireLabel" text-anchor="middle">bee 🐝 (walking L→R = entering)</text>
    </g>

    <!-- Spacing dimension -->
    <line x1="140" y1="160" x2="460" y2="160" stroke="#a08b6b" marker-start="url(#tinyArrow)" marker-end="url(#tinyArrow)"/>
    <text x="300" y="180" text-anchor="middle" class="dim">6–8 mm sensor spacing (aligned with tunnel axis)</text>

    <!-- Direction inference -->
    <text x="300" y="210" text-anchor="middle" class="subLabel">Beam A trips first, then Beam B (within 500 ms) → count as EXIT</text>
    <text x="300" y="225" text-anchor="middle" class="subLabel">Beam B trips first, then Beam A → count as ENTRY</text>
    <text x="300" y="240" text-anchor="middle" class="subLabel">Beam stays blocked &gt; 2 s (bee grooming in tunnel) → ignore, do not count</text>
  </g>

  <!-- ============ SENSOR WIRING SCHEMATIC (right of tunnel detail) ============ -->
  <g transform="translate(800, 480)">
    <text x="0" y="0" class="sect">Per-Sensor Wiring (one ITR9606)</text>

    <!-- ITR9606 schematic -->
    <g transform="translate(0, 30)">
      <rect x="30" y="10" width="360" height="200" fill="none" stroke="#f0b429" stroke-width="1.5"/>
      <text x="210" y="30" class="compLabel" text-anchor="middle">ITR9606 slotted opto</text>

      <!-- IR LED side -->
      <text x="55" y="60" fill="#f4e6c8" font-size="11">IR LED  (anode)</text>
      <line x1="55" y1="65" x2="55" y2="80" stroke="#f2933d" stroke-width="2"/>
      <polygon points="55,85 51,80 59,80" fill="#f2933d"/>
      <line x1="55" y1="85" x2="55" y2="105" stroke="#f2933d" stroke-width="2"/>
      <line x1="45" y1="85" x2="65" y2="85" stroke="#f2933d" stroke-width="2"/>
      <text x="70" y="90" fill="#f4e6c8" font-size="10">IR LED</text>
      <!-- 220Ω resistor -->
      <rect x="45" y="110" width="20" height="30" fill="none" stroke="#f4e6c8"/>
      <text x="80" y="130" fill="#f4e6c8" font-size="10">220 Ω</text>
      <line x1="55" y1="140" x2="55" y2="160" stroke="#000000" stroke-width="2"/>
      <text x="45" y="175" fill="#f4e6c8" font-size="10" text-anchor="end">GND</text>

      <!-- Header at top -->
      <line x1="55" y1="65" x2="55" y2="55" stroke="#f2933d" stroke-width="2"/>
      <text x="45" y="52" fill="#f4e6c8" font-size="10" text-anchor="end">3V3</text>

      <!-- Phototransistor side -->
      <text x="280" y="60" fill="#f4e6c8" font-size="11">Phototransistor (collector)</text>
      <line x1="330" y1="65" x2="330" y2="90" stroke="#e05b5b" stroke-width="2"/>
      <circle cx="330" cy="95" r="5" fill="none" stroke="#f4e6c8"/>
      <line x1="330" y1="100" x2="330" y2="160" stroke="#000000" stroke-width="2"/>
      <text x="340" y="105" fill="#f4e6c8" font-size="10">phototx</text>
      <text x="340" y="165" fill="#f4e6c8" font-size="10">emitter → GND</text>

      <!-- 10k pull-up + signal to GPIO -->
      <line x1="330" y1="65" x2="330" y2="45" stroke="#f2933d" stroke-width="2"/>
      <rect x="320" y="35" width="20" height="10" fill="none" stroke="#f4e6c8"/>
      <text x="345" y="42" fill="#f4e6c8" font-size="10">10 kΩ</text>
      <line x1="330" y1="35" x2="330" y2="25" stroke="#f2933d" stroke-width="2"/>
      <text x="330" y="20" fill="#f4e6c8" font-size="10" text-anchor="middle">3V3</text>

      <!-- Signal tap -->
      <line x1="330" y1="80" x2="380" y2="80" stroke="#ffffff" stroke-width="2"/>
      <text x="385" y="84" fill="#f4e6c8" font-size="11">→ Pico GPIO</text>
    </g>

    <text x="0" y="260" class="subLabel">Signal is HIGH (3V3) when beam is unbroken, LOW when a bee blocks the slot.</text>
    <text x="0" y="275" class="subLabel">Pico uses IRQ on both edges to time direction (see firmware/pico/drivers/bee_gate.py).</text>
  </g>

  <!-- ============ CHANNEL → GPIO MAPPING TABLE ============ -->
  <g transform="translate(80, 780)">
    <text x="0" y="0" class="sect">Channel → GPIO map (see docs/hardware.md)</text>
    <rect x="0" y="20" width="580" height="180" fill="#241d17" stroke="#f0b429"/>
    <g font-family="monospace" font-size="12" fill="#f4e6c8">
      <text x="20"  y="45">Tunnel   Beam A (outer)   Beam B (inner)</text>
      <line x1="20" y1="52" x2="520" y2="52" stroke="#a08b6b" stroke-width="0.5"/>
      <text x="20"  y="72">T1       GP0              GP8</text>
      <text x="20"  y="88">T2       GP1              GP9</text>
      <text x="20" y="104">T3       GP2              GP10</text>
      <text x="20" y="120">T4       GP3              GP11</text>
      <text x="20" y="136">T5       GP4              GP12</text>
      <text x="20" y="152">T6       GP5              GP13</text>
      <text x="20" y="168">T7       GP6              GP14</text>
      <text x="20" y="184">T8       GP7              GP15</text>
    </g>
  </g>

  <!-- ============ NOTES ============ -->
  <g transform="translate(700, 780)">
    <text x="0" y="0" class="sect">Build notes</text>
    <rect x="0" y="20" width="640" height="180" fill="#241d17" stroke="#f0b429"/>
    <g fill="#f4e6c8" font-size="12">
      <text x="15" y="45">• Material: ASA or PETG (UV + heat stable).  Do NOT use PLA — it warps in direct sun.</text>
      <text x="15" y="65">• Tunnel dimensions: 8 mm × 8 mm × 30 mm deep.  Forces single-file passage.</text>
      <text x="15" y="85">• Beams spaced 6–8 mm apart along tunnel axis.  Wider than that and the direction window becomes noisy.</text>
      <text x="15" y="105">• Slide-out design so you can clean propolis — do this monthly during flow.</text>
      <text x="15" y="125">• Wire runs from the 16 sensors back to the Pico with a ribbon; keep total length under 30 cm.</text>
      <text x="15" y="145">• All 32 resistors (16× 220 Ω + 16× 10 kΩ) live on a small carrier PCB, not inside the gate body.</text>
      <text x="15" y="165">• If GPIO count runs short (e.g. you also want I²S mic on Pico), swap 16 GPIO for one MCP23017.</text>
      <text x="15" y="185">• Reference build inspiration: github.com/hydronics/BeeCounter (Arduino, similar mechanicals).</text>
    </g>
  </g>

</svg>
