<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bee Hive Dashboard</title>
<style>
  :root { --bg:#1a1512; --card:#241d19; --fg:#f4e6c8; --accent:#f0b429; --muted:#a08b6b; }
  body { margin:0; padding:16px; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
         background: var(--bg); color: var(--fg); }
  h1 { color: var(--accent); margin: 0 0 12px; }
  .grid { display:grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap:12px; }
  .card { background: var(--card); border-radius: 10px; padding: 12px 16px;
          box-shadow: 0 2px 8px rgba(0,0,0,0.3); }
  .metric-label { font-size: 12px; text-transform: uppercase; letter-spacing: 1px; color: var(--muted); }
  .metric-value { font-size: 28px; font-weight: 600; margin-top: 4px; color: var(--fg); }
  .metric-sub { font-size: 12px; color: var(--muted); margin-top: 2px; }
  .chart-wrap { background: var(--card); border-radius: 10px; padding: 12px; margin-top: 12px; }
  canvas { max-width: 100%; }
  button { background: var(--accent); color: #1a1512; border: none; padding: 8px 14px;
           border-radius: 6px; font-weight: 600; cursor: pointer; margin-right: 8px; }
  button:hover { opacity: 0.9; }
  .controls { margin-top: 12px; }
  .status { font-size: 11px; color: var(--muted); }
</style>
</head>
<body>

<h1>🐝 Bee Hive</h1>
<div class="status" id="last-updated">loading…</div>

<div class="grid" id="cards"></div>

<div class="controls">
  <button onclick="tare()">Tare weight</button>
  <button onclick="calibratePrompt()">Calibrate…</button>
</div>

<div class="chart-wrap"><canvas id="chart-weight"></canvas></div>
<div class="chart-wrap"><canvas id="chart-temp"></canvas></div>
<div class="chart-wrap"><canvas id="chart-bees"></canvas></div>
<div class="chart-wrap"><canvas id="chart-battery"></canvas></div>

<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script>
const CARDS = [
  ["w_kg",   "Hive weight",  "kg"],
  ["t_in",   "Inside temp",  "°C"],
  ["rh_in",  "Inside RH",    "%"],
  ["t_out",  "Outside temp", "°C"],
  ["rh_out", "Outside RH",   "%"],
  ["p_hpa",  "Pressure",     "hPa"],
  ["lux",    "Light",        "lx"],
  ["co2_ppm","CO₂",          "ppm"],
  ["bees_in","Bees in / s",  ""],
  ["bees_out","Bees out / s",""],
  ["v_pack", "Battery pack", "V"],
];

async function refreshLatest() {
  const r = await fetch("/api/latest").then(r => r.json());
  const el = document.getElementById("cards");
  el.innerHTML = CARDS.map(([k, label, unit]) => {
    const v = r[k];
    const disp = (v === null || v === undefined) ? "—" :
                 (typeof v === "number" ? v.toFixed(2) : v);
    return `<div class="card">
      <div class="metric-label">${label}</div>
      <div class="metric-value">${disp} <span class="metric-sub">${unit}</span></div>
    </div>`;
  }).join("");
  if (r.ts) {
    document.getElementById("last-updated").textContent =
      "Latest: " + new Date(r.ts * 1000).toLocaleString();
  }
}

let charts = {};
function makeChart(id, label, key, color) {
  const ctx = document.getElementById(id);
  charts[id] = new Chart(ctx, {
    type: "line",
    data: { labels: [], datasets: [{ label, data: [], borderColor: color,
            backgroundColor: color + "33", tension: 0.2, pointRadius: 0 }] },
    options: { responsive: true, animation: false,
               scales: { x: { ticks: { color: "#a08b6b" } },
                         y: { ticks: { color: "#a08b6b" } } },
               plugins: { legend: { labels: { color: "#f4e6c8" } } } }
  });
  charts[id]._key = key;
}

async function refreshHistory() {
  const rows = await fetch("/api/history?hours=24").then(r => r.json());
  const labels = rows.map(r => new Date(r.ts * 1000).toLocaleTimeString());
  for (const id in charts) {
    const c = charts[id];
    c.data.labels = labels;
    if (Array.isArray(c._key)) {
      c.data.datasets.forEach((ds, i) => ds.data = rows.map(r => r[c._key[i]]));
    } else {
      c.data.datasets[0].data = rows.map(r => r[c._key]);
    }
    c.update("none");
  }
}

async function tare() {
  await fetch("/api/tare", { method: "POST" });
  alert("Tare command sent.");
}

async function calibratePrompt() {
  const v = prompt("Enter scale factor (kg per raw unit):");
  if (!v) return;
  await fetch("/api/calibrate", { method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ cal: parseFloat(v) }) });
  alert("Calibration sent.");
}

// Initialize
makeChart("chart-weight",   "Hive weight (kg)",  "w_kg", "#f0b429");
makeChart("chart-temp",     "Temp (°C)",         "t_in", "#e05b5b");
makeChart("chart-bees",     "Bees / min",        "bees_in", "#7aa87a");
makeChart("chart-battery",  "Pack voltage (V)",  "v_pack", "#4a90d9");

refreshLatest(); refreshHistory();
setInterval(refreshLatest,  5_000);
setInterval(refreshHistory, 60_000);
</script>

</body>
</html>
